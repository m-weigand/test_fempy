name: STAGING Build wheels for MacOS
# https://github.com/scipy/scipy/blob/main/tools/wheels/cibw_before_build_macos.sh

on:
  # [push, pull_request]
  workflow_dispatch:

env:
  # CIBW_ARCHS_MACOS: "x86_64 universal2 arm64"
  # CIBW_BUILD: "cp313-macosx_x86_64 cp313-macosx_universal2 cp313-macosx_arm64"
  # CIBW_ARCHS_MACOS: "x86_64"
  CIBW_ARCHS_MACOS: "arm64"
  # https://cibuildwheel.pypa.io/en/stable/options/
  CIBW_BUILD: "cp313-macosx_arm64 cp314-macosx_arm64"
  # https://cibuildwheel.pypa.io/en/stable/platforms/#macos-version-compatibility
  MACOSX_DEPLOYMENT_TARGET: "15.0"


jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # https://docs.github.com/en/actions/using-github-hosted-runners/using-github-hosted-runners/about-github-hosted-runners#standard-github-hosted-runners-for-public-repositories
        os: [macos-latest]

    steps:
      - uses: actions/checkout@v6

      # Used to host cibuildwheel
      - uses: actions/setup-python@v5

      - name: Install stuff
        run: |
          brew update
          brew install libomp
          # which conda
          # which mamba
          
      - name: Install gfortran
        run: |
          brew reinstall gfortran

      - name: check gfortran 1
        run: |
          brew reinstall gfortran

      # - name: test 1
      #   run: |
      #     ls -1 /opt/homebrew/bin
      #     env
      #     gfortran
      #     # which conda
      #     # which mamba

      - name: Build wheels
        run: |
          cd both_v1/
          pip wheel .
          ls -l *.whl

      - name: Install cibuildwheel
        run: python -m pip install cibuildwheel

      - name: Build wheels via cibuildwheel
        run: |
          pwd
          cd both_v1/
          python -m cibuildwheel --output-dir wheelhouse
          ls wheelhouse
        # to supply options, put them in 'env', like:
        # env:
        #   CIBW_BUILD: "cp314-macosx_arm64"

      # pycrtomomod-0.0.10-cp314-cp314-macosx_15_0_arm64.whl
      - uses: actions/upload-artifact@v4
        with:
          name: cibw-wheels-${{ matrix.os }}-${{ strategy.job-index }}
          path: both_v1/wheelhouse/*.whl
